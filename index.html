<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pica Pica Pro - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom-color: #3b82f6; color: #3b82f6; }
        .tab-container { display: flex; align-items: center; }
        /* Spinners */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        .loader-small {
            display: inline-block;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { z-index: 50; }
        .modal-content { max-height: 90vh; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <div id="app-container" class="container mx-auto max-w-4xl p-4">
        <header class="text-center my-6">
            <h1 class="text-4xl font-bold text-gray-900">Pica Pica Pro</h1>
            <p class="text-gray-600 mt-2">Gestión de inventario y locales.</p>
        </header>

        <!-- Pestañas de Locales -->
        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-6 items-center" id="location-tabs">
                <!-- Las pestañas se generarán dinámicamente -->
            </nav>
        </div>

        <!-- Controles Principales -->
        <div class="bg-white p-4 rounded-lg shadow-md mb-6 flex flex-col sm:flex-row gap-4">
            <button onclick="showAddProductModal()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                Añadir Nuevo Producto
            </button>
            <button onclick="showHistoryModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                Ver Historial
            </button>
        </div>
        
        <!-- Filtro y búsqueda -->
        <div class="mb-4 flex flex-col sm:flex-row gap-4">
            <input type="text" id="search-input" onkeyup="renderProducts()" class="w-full sm:flex-1 border-gray-300 rounded-lg p-3 text-lg" placeholder="Buscar producto...">
            <select id="filter-select" onchange="renderProducts()" class="w-full sm:w-auto border-gray-300 rounded-lg p-3 text-lg bg-white">
                <option value="az">Alfabético (A-Z)</option>
                <option value="high_stock">Mayor Stock</option>
                <option value="low_stock">Menor Stock</option>
                <option value="alert_stock">Stock Bajo</option>
            </select>
        </div>

        <!-- Lista de Productos -->
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Los productos se insertarán aquí -->
        </div>

        <div id="empty-state" class="hidden text-center py-16">
            <h3 class="mt-2 text-lg font-medium text-gray-900">No hay productos en esta ubicación</h3>
            <p class="mt-1 text-sm text-gray-500">Añade un producto para empezar.</p>
        </div>
        
        <div id="loader-main" class="flex justify-center py-16"><div class="loader"></div></div>
    </div>

    <!-- Modals -->
    <!-- Add/Edit Product, Stock, Location Modals... -->
    <div id="addProductModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md overflow-y-auto modal-content">
            <h2 class="text-2xl font-bold mb-4">Añadir Nuevo Producto</h2>
            <div class="space-y-4">
                <input type="text" id="newProductName" class="w-full border-gray-300 rounded-lg p-3" placeholder="Nombre del producto">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Foto del Producto (Opcional)</label>
                    <input type="file" id="newProductImageFile" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <input type="number" id="newProductMinStock" class="w-full border-gray-300 rounded-lg p-3" placeholder="Alerta de stock bajo (ej: 5)">
            </div>
            <div class="mt-6 flex justify-end space-x-4">
                <button onclick="hideModal('addProductModal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
                <button onclick="addProduct()" id="addProductBtn" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold flex items-center justify-center disabled:opacity-50">Añadir</button>
            </div>
        </div>
    </div>
    
    <div id="editProductModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md overflow-y-auto modal-content">
            <h2 class="text-2xl font-bold mb-4">Editar Producto</h2>
            <div class="space-y-4">
                <input type="hidden" id="editProductId">
                <input type="text" id="editProductName" class="w-full border-gray-300 rounded-lg p-3" placeholder="Nombre del producto">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cambiar Foto (Opcional)</label>
                    <img id="editProductCurrentImage" src="" alt="Current Image" class="w-24 h-24 object-cover rounded-md mb-2">
                    <input type="file" id="editProductImageFile" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <input type="number" id="editProductMinStock" class="w-full border-gray-300 rounded-lg p-3" placeholder="Alerta de stock bajo (ej: 5)">
            </div>
            <div class="mt-6 flex justify-end space-x-4">
                <button onclick="hideModal('editProductModal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
                <button onclick="handleProductUpdate()" id="updateProductBtn" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold flex items-center justify-center disabled:opacity-50">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="updateStockModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4" id="updateStockTitle">Actualizar Stock</h2>
            <p id="updateStockProductName" class="mb-4 text-gray-600"></p>
            <input type="number" id="updateStockQuantity" class="w-full border-gray-300 rounded-lg p-3" placeholder="Cantidad">
            <input type="hidden" id="updateStockProductId">
            <input type="hidden" id="updateStockType">
            <div class="mt-6 flex justify-end space-x-4">
                <button onclick="hideModal('updateStockModal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
                <button onclick="handleStockUpdate()" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold">Confirmar</button>
            </div>
        </div>
    </div>
    
    <div id="moveStockModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Mover Stock</h2>
            <p id="moveStockProductName" class="mb-4 text-gray-600"></p>
            <div class="space-y-4">
                <input type="number" id="moveStockQuantity" class="w-full border-gray-300 rounded-lg p-3" placeholder="Cantidad a mover">
                <select id="moveStockTarget" class="w-full border-gray-300 rounded-lg p-3 bg-gray-100"></select>
            </div>
            <input type="hidden" id="moveStockProductId">
            <div class="mt-6 flex justify-end space-x-4">
                <button onclick="hideModal('moveStockModal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
                <button onclick="handleStockMove()" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold">Mover</button>
            </div>
        </div>
    </div>

    <div id="addLocationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Añadir Nuevo Local</h2>
            <input type="text" id="newLocationName" class="w-full border-gray-300 rounded-lg p-3" placeholder="Nombre del local">
            <div class="mt-6 flex justify-end space-x-4">
                <button onclick="hideModal('addLocationModal')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
                <button onclick="addLocation()" class="px-6 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold">Añadir Local</button>
            </div>
        </div>
    </div>

    <!-- Historial Modal -->
    <div id="historyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 modal">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-4xl flex flex-col modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Historial de Movimientos</h2>
                <button onclick="hideModal('historyModal')" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div class="flex-grow overflow-y-auto border rounded-lg">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Local</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ingresado</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Vendido</th>
                        </tr>
                    </thead>
                    <tbody id="history-log-body" class="bg-white divide-y divide-gray-200">
                        <!-- Logs will be inserted here -->
                    </tbody>
                </table>
                 <div id="history-loader" class="flex justify-center p-8"><div class="loader"></div></div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="downloadHistoryCSV()" id="downloadCsvBtn" class="px-6 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-bold flex items-center justify-center disabled:opacity-50">
                    Descargar a Excel (.csv)
                </button>
            </div>
        </div>
    </div>

<script>
    
// --- CONFIGURACIÓN DE FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyBcwgeGGT4vlKrtfTOyF-j_6NiR5lvfhqY",
  authDomain: "pica-pica-inventario.firebaseapp.com",
  projectId: "pica-pica-inventario",
  storageBucket: "pica-pica-inventario.firebasestorage.app",
  messagingSenderId: "529089822166",
  appId: "1:529089822166:web:34f5db0e2ce1a790d3b877",
  measurementId: "G-P7QYQ4W062"
};

// --- CONFIGURACIÓN DE CLOUDINARY ---
const CLOUDINARY_CLOUD_NAME = "djc5nmwdr";
const CLOUDINARY_UPLOAD_PRESET = "Pica Pica";
const CLOUDINARY_API_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

// --- INICIALIZACIÓN DE LA APP ---
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const productsCollection = db.collection('products');
const locationsCollection = db.collection('locations');
const logsCollection = db.collection('inventory_logs');

let allProducts = [];
let allLocations = [];
let currentLocation = null;

document.addEventListener('DOMContentLoaded', () => {
    auth.signInAnonymously().catch(error => console.error("Error al iniciar sesión anónimo:", error));
    auth.onAuthStateChanged(user => {
        if (user) {
            console.log("Usuario autenticado:", user.uid);
            listenForLocations();
            listenForProducts();
        } else {
            console.log("Usuario no autenticado.");
        }
    });
});

// --- LÓGICA DE DATOS (FIRESTORE) ---
function listenForLocations() {
    locationsCollection.onSnapshot(snapshot => {
        allLocations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allLocations.sort((a, b) => a.name.localeCompare(b.name));
        const currentStillExists = allLocations.some(loc => loc.id === currentLocation);
        if (!currentStillExists) {
            currentLocation = allLocations.length > 0 ? allLocations[0].id : null;
        }
        renderLocationTabs();
        renderProducts();
    }, error => console.error("Error al cargar locales:", error));
}

function listenForProducts() {
    const loader = document.getElementById('loader-main');
    productsCollection.onSnapshot(snapshot => {
        loader.style.display = 'none';
        allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderProducts();
    }, error => {
        loader.style.display = 'none';
        console.error("Error al cargar productos: ", error);
        alert("Error al conectar con la base de datos de productos.");
    });
}

async function addProduct() {
    if (allLocations.length === 0) {
        alert("Primero debes añadir un local antes de poder añadir productos.");
        return;
    }
    const name = document.getElementById('newProductName').value.trim();
    const minStock = parseInt(document.getElementById('newProductMinStock').value) || 0;
    const imageFile = document.getElementById('newProductImageFile').files[0];
    const addButton = document.getElementById('addProductBtn');

    if (!name) { alert("El nombre del producto es obligatorio."); return; }

    addButton.disabled = true;
    addButton.innerHTML = `<div class="loader-small"></div> Subiendo...`;

    let imageUrl = '';
    try {
        if (imageFile) {
            const formData = new FormData();
            formData.append('file', imageFile);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const response = await fetch(CLOUDINARY_API_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Error al subir la imagen a Cloudinary');
            const data = await response.json();
            imageUrl = data.secure_url;
        }

        const initialStock = {};
        allLocations.forEach(loc => { initialStock[loc.id] = 0; });

        await productsCollection.add({ name, imageUrl, minStock, stock: initialStock });
        hideModal('addProductModal');
        document.getElementById('newProductName').value = '';
        document.getElementById('newProductImageFile').value = '';
        document.getElementById('newProductMinStock').value = '';
    } catch (error) {
        console.error("Error al añadir producto: ", error);
        alert("Hubo un error al guardar el producto.");
    } finally {
        addButton.disabled = false;
        addButton.innerHTML = 'Añadir';
    }
}

async function handleProductUpdate() {
    const productId = document.getElementById('editProductId').value;
    const name = document.getElementById('editProductName').value.trim();
    const minStock = parseInt(document.getElementById('editProductMinStock').value) || 0;
    const imageFile = document.getElementById('editProductImageFile').files[0];
    const updateButton = document.getElementById('updateProductBtn');
    
    if (!name) { alert("El nombre del producto es obligatorio."); return; }

    updateButton.disabled = true;
    updateButton.innerHTML = `<div class="loader-small"></div> Guardando...`;

    const product = allProducts.find(p => p.id === productId);
    let imageUrl = product.imageUrl;

    try {
        if (imageFile) {
            const formData = new FormData();
            formData.append('file', imageFile);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const response = await fetch(CLOUDINARY_API_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Error al subir la nueva imagen');
            const data = await response.json();
            imageUrl = data.secure_url;
        }
        await productsCollection.doc(productId).update({ name, minStock, imageUrl });
        hideModal('editProductModal');
    } catch (error) {
        console.error("Error al actualizar producto: ", error);
        alert("Hubo un error al guardar los cambios.");
    } finally {
        updateButton.disabled = false;
        updateButton.innerHTML = 'Guardar Cambios';
    }
}

function updateProductStock(productId, location, newStock, type, quantity) {
    const updateData = { [`stock.${location}`]: newStock };
    const product = allProducts.find(p => p.id === productId);
    const locationObj = allLocations.find(l => l.id === location);

    const logData = {
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        productId: productId,
        productName: product.name,
        locationId: location,
        locationName: locationObj.name,
        type: type,
        quantity: quantity
    };

    const batch = db.batch();
    batch.update(productsCollection.doc(productId), updateData);
    batch.set(logsCollection.doc(), logData);
    
    batch.commit().catch(error => console.error("Error al actualizar stock y registrar log:", error));
}


function confirmDeleteProduct(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    if (confirm(`¿Estás seguro de que quieres eliminar "${product.name}"? Esta acción no se puede deshacer.`)) {
        productsCollection.doc(productId).delete().catch(error => alert("Hubo un error al eliminar el producto."));
    }
}

async function addLocation() {
    const nameInput = document.getElementById('newLocationName');
    const name = nameInput.value.trim();
    if (!name) { alert("El nombre del local es obligatorio."); return; }

    try {
        const newLocationRef = await locationsCollection.add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        const batch = db.batch();
        allProducts.forEach(product => {
            const productRef = productsCollection.doc(product.id);
            batch.update(productRef, { [`stock.${newLocationRef.id}`]: 0 });
        });
        await batch.commit();
        hideModal('addLocationModal');
        nameInput.value = '';
    } catch(error) {
        console.error("Error al añadir local: ", error);
        alert("Hubo un error al guardar el local.");
    }
}

async function confirmDeleteLocation(locationId, locationName) {
    if (!confirm(`¿Estás seguro de que quieres eliminar el local "${locationName}"?`)) return;
    if (!confirm(`ACCION PERMANENTE: Se borrará el local y todo el stock asociado a él. ¿Continuar?`)) return;

    try {
        const batch = db.batch();
        allProducts.forEach(product => {
            const productRef = productsCollection.doc(product.id);
            batch.update(productRef, { [`stock.${locationId}`]: firebase.firestore.FieldValue.delete() });
        });
        batch.delete(locationsCollection.doc(locationId));
        await batch.commit();
    } catch (error) {
        console.error("Error al eliminar local: ", error);
        alert("Hubo un error al eliminar el local.");
    }
}

// --- RENDERIZADO Y UI ---
// renderLocationTabs, renderProducts, and modal handlers...
function renderLocationTabs() {
    const tabsContainer = document.getElementById('location-tabs');
    tabsContainer.innerHTML = '';
    
    allLocations.forEach(loc => {
        const tabContainer = document.createElement('div');
        tabContainer.className = 'tab-container relative';

        const tabButton = document.createElement('button');
        tabButton.onclick = () => changeLocation(loc.id);
        tabButton.dataset.location = loc.id;
        tabButton.className = 'whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg';
        tabButton.textContent = loc.name;

        if (loc.id === currentLocation) {
            tabButton.classList.add('tab-active');
            
            const deleteBtn = document.createElement('button');
            deleteBtn.onclick = (e) => { e.stopPropagation(); confirmDeleteLocation(loc.id, loc.name); };
            deleteBtn.className = 'ml-2 text-gray-400 hover:text-red-500';
            deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>`;
            tabContainer.appendChild(tabButton);
            tabContainer.appendChild(deleteBtn);
        } else {
            tabButton.classList.add('text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
            tabContainer.appendChild(tabButton);
        }
        tabsContainer.appendChild(tabContainer);
    });

    const addTabButton = document.createElement('button');
    addTabButton.onclick = () => showModal('addLocationModal');
    addTabButton.className = 'ml-4 py-2 px-3 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-full h-8 w-8';
    addTabButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>`;
    tabsContainer.appendChild(addTabButton);
}

function renderProducts() {
    const productList = document.getElementById('product-list');
    const emptyState = document.getElementById('empty-state');
    const searchTerm = document.getElementById('search-input').value.toLowerCase();
    const filterValue = document.getElementById('filter-select').value;
    
    productList.innerHTML = '';
    
    if (!currentLocation) {
        emptyState.innerHTML = `<h3 class="mt-2 text-lg font-medium text-gray-900">No hay locales</h3><p class="mt-1 text-sm text-gray-500">Añade tu primer local usando el botón '+' para empezar.</p>`;
        emptyState.style.display = 'block';
        return;
    }

    // Filter by Search Term
    let filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(searchTerm));

    // Filter by "Stock Bajo" if selected
    if (filterValue === 'alert_stock') {
        filteredProducts = filteredProducts.filter(p => {
            const stock = (p.stock && p.stock[currentLocation]) || 0;
            const minStock = p.minStock || 0;
            return stock <= minStock && minStock > 0;
        });
    }

    // Sort Products
    if (filterValue === 'high_stock') {
        filteredProducts.sort((a, b) => {
            const stockA = (a.stock && a.stock[currentLocation]) || 0;
            const stockB = (b.stock && b.stock[currentLocation]) || 0;
            return stockB - stockA;
        });
    } else if (filterValue === 'low_stock') {
        filteredProducts.sort((a, b) => {
            const stockA = (a.stock && a.stock[currentLocation]) || 0;
            const stockB = (b.stock && b.stock[currentLocation]) || 0;
            return stockA - stockB;
        });
    } else {
        // Default: A-Z (for 'az' or 'alert_stock')
        filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
    }

    if (filteredProducts.length === 0) {
        emptyState.innerHTML = `<h3 class="mt-2 text-lg font-medium text-gray-900">No hay productos</h3><p class="mt-1 text-sm text-gray-500">Intenta con otra búsqueda o filtro.</p>`;
        emptyState.style.display = 'block';
    } else {
        emptyState.style.display = 'none';
        filteredProducts.forEach(product => {
            const stock = (product.stock && product.stock[currentLocation]) || 0;
            const minStock = product.minStock || 0;
            const isLowStock = stock <= minStock && minStock > 0;

            const card = document.createElement('div');
            card.className = `bg-white rounded-lg shadow-md p-4 flex flex-col transition-all border-2 ${isLowStock ? 'border-red-500 bg-red-50' : 'border-transparent'}`;
            
            card.innerHTML = `
                <img src="${product.imageUrl || 'https://placehold.co/400x300/e2e8f0/cbd5e0?text=Sin+Imagen'}" alt="${product.name}" class="w-full h-40 object-cover rounded-md mb-4">
                <div class="flex-grow">
                    <div class="flex justify-between items-start">
                        <h2 class="text-xl font-bold truncate pr-2 flex-1">${product.name}</h2>
                        <div class="flex items-center flex-shrink-0">
                            <button onclick="showEditProductModal('${product.id}')" class="text-gray-400 hover:text-blue-500 p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.732 3.732z" /></svg>
                            </button>
                            <button onclick="confirmDeleteProduct('${product.id}')" class="text-gray-400 hover:text-red-500 p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-gray-600">Stock: <span class="font-bold text-2xl text-blue-600">${stock}</span></p>
                    ${isLowStock ? `<p class="text-red-600 font-bold text-sm">¡Stock bajo! (Mín: ${minStock})</p>` : ''}
                </div>
                <div class="mt-4 grid grid-cols-2 gap-3">
                    <button onclick="showUpdateStockModal('${product.id}', 'in')" class="bg-green-100 text-green-800 hover:bg-green-200 font-semibold py-2 px-3 rounded-lg">Ingresar</button>
                    <button onclick="showUpdateStockModal('${product.id}', 'out')" class="bg-red-100 text-red-800 hover:bg-red-200 font-semibold py-2 px-3 rounded-lg">Vender</button>
                </div>
                <button onclick="showMoveStockModal('${product.id}')" class="w-full mt-2 bg-gray-200 text-gray-800 hover:bg-gray-300 font-semibold py-2 px-3 rounded-lg">Mover Stock</button>
            `;
            productList.appendChild(card);
        });
    }
}

function changeLocation(newLocationId) {
    currentLocation = newLocationId;
    renderLocationTabs();
    renderProducts();
}

// --- MANEJO DE MODALES ---
function showModal(modalId) { document.getElementById(modalId).classList.remove('hidden'); document.getElementById(modalId).classList.add('flex'); }
function hideModal(modalId) { document.getElementById(modalId).classList.add('hidden'); document.getElementById(modalId).classList.remove('flex'); }

function showAddProductModal() { 
    if (allLocations.length === 0) {
        alert("Primero debes añadir un local usando el botón '+' para poder añadir productos.");
        return;
    }
    document.getElementById('newProductName').value = '';
    document.getElementById('newProductImageFile').value = '';
    document.getElementById('newProductMinStock').value = '';
    showModal('addProductModal'); 
}

function showEditProductModal(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    document.getElementById('editProductId').value = product.id;
    document.getElementById('editProductName').value = product.name;
    document.getElementById('editProductMinStock').value = product.minStock;
    document.getElementById('editProductCurrentImage').src = product.imageUrl || 'https://placehold.co/400x300/e2e8f0/cbd5e0?text=Sin+Imagen';
    document.getElementById('editProductImageFile').value = '';
    showModal('editProductModal');
}

function handleStockUpdate() {
    const productId = document.getElementById('updateStockProductId').value;
    const type = document.getElementById('updateStockType').value;
    const quantity = parseInt(document.getElementById('updateStockQuantity').value);
    
    if (!productId || isNaN(quantity) || quantity <= 0) { alert("Por favor, introduce una cantidad válida."); return; }

    const product = allProducts.find(p => p.id === productId);
    const currentStock = (product.stock && product.stock[currentLocation]) || 0;

    let newStock;
    if (type === 'in') {
        newStock = currentStock + quantity;
    } else {
        if (quantity > currentStock) { alert("No puedes vender más stock del que tienes en esta ubicación."); return; }
        newStock = currentStock - quantity;
    }
    
    updateProductStock(productId, currentLocation, newStock, type, quantity);
    hideModal('updateStockModal');
}

function showUpdateStockModal(productId, type) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    document.getElementById('updateStockTitle').innerText = type === 'in' ? 'Ingresar Stock' : 'Registrar Venta';
    document.getElementById('updateStockProductName').innerText = product.name;
    document.getElementById('updateStockProductId').value = productId;
    document.getElementById('updateStockType').value = type;
    document.getElementById('updateStockQuantity').value = '';
    showModal('updateStockModal');
    document.getElementById('updateStockQuantity').focus();
}

function showMoveStockModal(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;

    const targetSelect = document.getElementById('moveStockTarget');
    targetSelect.innerHTML = '';
    
    const availableTargets = allLocations.filter(loc => loc.id !== currentLocation);
    if (availableTargets.length === 0) { alert("No hay otros locales a los que mover stock. Añade otro local primero."); return; }
    
    availableTargets.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc.id;
        option.innerText = loc.name;
        targetSelect.appendChild(option);
    });

    const currentStock = (product.stock && product.stock[currentLocation]) || 0;
    const currentLocName = allLocations.find(l => l.id === currentLocation)?.name || 'local actual';
    document.getElementById('moveStockProductName').innerText = `Mover: ${product.name} (Stock en ${currentLocName}: ${currentStock})`;
    document.getElementById('moveStockProductId').value = productId;
    document.getElementById('moveStockQuantity').value = '';
    showModal('moveStockModal');
    document.getElementById('moveStockQuantity').focus();
}

function handleStockMove() {
    const productId = document.getElementById('moveStockProductId').value;
    const quantity = parseInt(document.getElementById('moveStockQuantity').value);
    const targetLocation = document.getElementById('moveStockTarget').value;
    if (!productId || !targetLocation || isNaN(quantity) || quantity <= 0) { alert("Por favor, introduce una cantidad válida."); return; }

    const product = allProducts.find(p => p.id === productId);
    const sourceStock = (product.stock && product.stock[currentLocation]) || 0;
    if (quantity > sourceStock) { alert(`No puedes mover más stock del que tienes.`); return; }

    const newSourceStock = sourceStock - quantity;
    const newTargetStock = ((product.stock && product.stock[targetLocation]) || 0) + quantity;
    
    const updateData = { [`stock.${currentLocation}`]: newSourceStock, [`stock.${targetLocation}`]: newTargetStock };
    productsCollection.doc(productId).update(updateData)
        .then(() => hideModal('moveStockModal'))
        .catch(error => console.error("Error al mover stock:", error));
}

// --- Historial ---
async function showHistoryModal() {
    showModal('historyModal');
    const historyBody = document.getElementById('history-log-body');
    const loader = document.getElementById('history-loader');
    historyBody.innerHTML = '';
    loader.style.display = 'flex';

    try {
        const snapshot = await logsCollection.orderBy('timestamp', 'desc').limit(100).get();
        const logs = snapshot.docs.map(doc => doc.data());
        
        if (logs.length === 0) {
            historyBody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-gray-500">No hay movimientos registrados.</td></tr>`;
        } else {
            logs.forEach(log => {
                const date = log.timestamp ? log.timestamp.toDate() : new Date();
                const formattedDate = date.toLocaleDateString('es-ES');
                const formattedTime = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                const row = `
                    <tr class="text-sm">
                        <td class="px-4 py-3 font-medium">${log.locationName}</td>
                        <td class="px-4 py-3 text-gray-600">${formattedDate} ${formattedTime}</td>
                        <td class="px-4 py-3 text-gray-800">${log.productName}</td>
                        <td class="px-4 py-3 text-right font-semibold ${log.type === 'in' ? 'text-green-600' : ''}">${log.type === 'in' ? log.quantity : ''}</td>
                        <td class="px-4 py-3 text-right font-semibold ${log.type === 'out' ? 'text-red-600' : ''}">${log.type === 'out' ? log.quantity : ''}</td>
                    </tr>
                `;
                historyBody.innerHTML += row;
            });
        }
    } catch (error) {
        console.error("Error al cargar historial:", error);
        historyBody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-red-500">Error al cargar el historial.</td></tr>`;
    } finally {
        loader.style.display = 'none';
    }
}

async function downloadHistoryCSV() {
    const downloadBtn = document.getElementById('downloadCsvBtn');
    downloadBtn.disabled = true;
    downloadBtn.innerHTML = `<div class="loader-small"></div> Descargando...`;

    try {
        const snapshot = await logsCollection.orderBy('timestamp', 'desc').get();
        const logs = snapshot.docs.map(doc => doc.data());

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Local,Fecha,Hora,Producto,Cantidad Ingresada,Cantidad Vendida\r\n";

        logs.forEach(log => {
            const date = log.timestamp ? log.timestamp.toDate() : new Date();
            const formattedDate = date.toLocaleDateString('es-ES');
            const formattedTime = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const productName = `"${log.productName.replace(/"/g, '""')}"`; // Escape double quotes
            const qtyIn = log.type === 'in' ? log.quantity : '';
            const qtyOut = log.type === 'out' ? log.quantity : '';
            
            const row = [log.locationName, formattedDate, formattedTime, productName, qtyIn, qtyOut].join(',');
            csvContent += row + "\r\n";
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "historial_inventario.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
    } catch(error) {
        console.error("Error al descargar CSV:", error);
        alert("No se pudo generar el archivo CSV.");
    } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerText = 'Descargar a Excel (.csv)';
    }
}
